<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>6 MESES</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="6 MESES">
<meta name="theme-color" content="#1b1a17">
<link rel="apple-touch-icon" href="icon.png">
<style>
  /* --s la fija fit() en JS: es cuántos px de pantalla mide 1 píxel de Game Boy.
     TODA la consola está medida en esa unidad, así que crece y encoge junta. */
  :root { --s:2; --u:calc(var(--s) * 1px); }

  * { margin:0; padding:0; box-sizing:border-box;
      -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none; }
  html, body {
    height:100%; overflow:hidden; overscroll-behavior:none;
    background:#1b1a17;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    -webkit-text-size-adjust:100%;
    touch-action:none; user-select:none; -webkit-user-select:none;
  }

  /* Área realmente visible: descuenta Dynamic Island, barras y home indicator */
  #stage {
    position:fixed; overflow:hidden;
    top:   calc(env(safe-area-inset-top,    0px) + 6px);
    right: calc(env(safe-area-inset-right,  0px) + 6px);
    bottom:calc(env(safe-area-inset-bottom, 0px) + 6px);
    left:  calc(env(safe-area-inset-left,   0px) + 6px);
    display:flex; align-items:center; justify-content:center;
  }

  .gb {
    flex:0 0 auto;
    background:linear-gradient(160deg,#d6d2c4 0%,#c4c0b4 45%,#adaa9e 100%);
    border-radius:calc(6*var(--u)) calc(6*var(--u)) calc(23*var(--u)) calc(6*var(--u));
    padding:calc(7*var(--u)) calc(7*var(--u)) calc(8*var(--u));
    box-shadow:0 calc(6*var(--u)) calc(14*var(--u)) rgba(0,0,0,.55),
               inset 0 calc(1*var(--u)) 0 rgba(255,255,255,.55),
               inset 0 calc(-1.5*var(--u)) 0 rgba(0,0,0,.18);
    display:flex; flex-direction:column; align-items:center; gap:calc(5*var(--u));
  }

  .bezel {
    background:#57545c;
    border-radius:calc(4*var(--u)) calc(4*var(--u)) calc(13*var(--u)) calc(4*var(--u));
    padding:calc(7*var(--u)) calc(11*var(--u)) calc(10*var(--u)); position:relative;
    box-shadow:inset 0 calc(1*var(--u)) calc(2.5*var(--u)) rgba(0,0,0,.6);
  }
  .bezel::before {
    content:"DOT MATRIX WITH STEREO SOUND";
    position:absolute; bottom:calc(3*var(--u)); left:0; right:0; text-align:center;
    font-size:calc(3*var(--u)); letter-spacing:calc(.45*var(--u)); color:#8f8c96;
  }
  .lamp {
    position:absolute; left:calc(4*var(--u)); top:50%;
    width:calc(3*var(--u)); height:calc(3*var(--u)); border-radius:50%;
    background:#e0554e; box-shadow:0 0 calc(2.5*var(--u)) #e0554e; transform:translateY(-50%);
  }
  canvas {
    display:block; image-rendering:pixelated; image-rendering:crisp-edges;
    background:#9bbc0f;
    width:calc(160*var(--u)); height:calc(144*var(--u));
  }

  .brand {
    font-size:calc(4.5*var(--u)); letter-spacing:calc(.5*var(--u));
    color:#3a3a55; font-weight:700; align-self:flex-start; padding-left:calc(2*var(--u));
  }
  .brand span { font-style:italic; color:#7b3f6d; }

  .pad {
    display:flex; align-items:center; justify-content:space-between;
    width:100%; padding:calc(1*var(--u)) calc(3*var(--u)) 0;
  }

  .dpad { position:relative; width:calc(56*var(--u)); height:calc(56*var(--u)); }
  .dpad button, .dpad .c {
    position:absolute; background:#33313a; border:0; color:#8a8894;
    font-size:calc(6*var(--u)); line-height:1;
  }
  .dpad button { box-shadow:0 calc(1*var(--u)) 0 #17161b; }
  .dpad .u { left:calc(19*var(--u)); top:0;    width:calc(18*var(--u)); height:calc(19*var(--u)); border-radius:calc(2*var(--u)) calc(2*var(--u)) 0 0; }
  .dpad .d { left:calc(19*var(--u)); bottom:0; width:calc(18*var(--u)); height:calc(19*var(--u)); border-radius:0 0 calc(2*var(--u)) calc(2*var(--u)); }
  .dpad .l { top:calc(19*var(--u)); left:0;    width:calc(19*var(--u)); height:calc(18*var(--u)); border-radius:calc(2*var(--u)) 0 0 calc(2*var(--u)); }
  .dpad .r { top:calc(19*var(--u)); right:0;   width:calc(19*var(--u)); height:calc(18*var(--u)); border-radius:0 calc(2*var(--u)) calc(2*var(--u)) 0; }
  .dpad .c { left:calc(19*var(--u)); top:calc(19*var(--u)); width:calc(18*var(--u)); height:calc(18*var(--u)); }

  .ab { display:flex; gap:calc(8*var(--u)); align-items:center; transform:rotate(-20deg); }
  .ab button {
    width:calc(26*var(--u)); height:calc(26*var(--u)); border-radius:50%; border:0;
    background:radial-gradient(circle at 35% 30%,#a8536f,#7b2f4d);
    color:#f1e2ea; font-size:calc(9*var(--u)); font-weight:700; line-height:1;
    box-shadow:0 calc(1.5*var(--u)) 0 #4d1c30;
  }
  button:active { transform:translateY(calc(1*var(--u))); box-shadow:none !important; }
  .ab button:active { transform:rotate(0deg) translateY(calc(1*var(--u))); }

  .sys { display:flex; gap:calc(15*var(--u)); margin-top:calc(1*var(--u)); }
  .sys button {
    position:relative;
    width:calc(30*var(--u)); height:calc(7*var(--u));
    border-radius:calc(4*var(--u)); border:0; background:#8a8894;
    transform:rotate(-20deg); box-shadow:0 calc(1*var(--u)) 0 #55535c;
  }
  /* área táctil generosa sin agrandar el botón dibujado */
  .sys button::before { content:""; position:absolute; inset:calc(-7*var(--u)) calc(-5*var(--u)); }
  .sys .lbl {
    font-size:calc(4*var(--u)); color:#4b4956; letter-spacing:calc(.5*var(--u));
    text-align:center; margin-top:calc(3*var(--u));
  }
  .sysgroup { display:flex; flex-direction:column; align-items:center; }

  .mute {
    position:fixed; z-index:5;
    top:  calc(env(safe-area-inset-top,   0px) + 8px);
    right:calc(env(safe-area-inset-right, 0px) + 10px);
    min-height:40px; padding:10px 13px;
    background:rgba(255,255,255,.08); color:#9bbc0f; border:1px solid #4a4a44;
    border-radius:8px; font-size:11px; font-family:inherit;
  }
</style>
</head>
<body>

<button class="mute" id="mute">SONIDO: OFF</button>

<div id="stage">
<div class="gb">
  <div class="brand">GAME <span>NOSOTROS</span></div>
  <div class="bezel">
    <div class="lamp"></div>
    <canvas id="lcd" width="160" height="144"></canvas>
  </div>

  <div class="pad">
    <div class="dpad">
      <button class="u" data-k="up">▲</button>
      <button class="l" data-k="left">◀</button>
      <div class="c"></div>
      <button class="r" data-k="right">▶</button>
      <button class="d" data-k="down">▼</button>
    </div>
    <div class="ab">
      <button data-k="b">B</button>
      <button data-k="a">A</button>
    </div>
  </div>

  <div class="sys">
    <div class="sysgroup"><button data-k="select"></button><div class="lbl">SELECT</div></div>
    <div class="sysgroup"><button data-k="start"></button><div class="lbl">START</div></div>
  </div>
</div>
</div>

<script>
/* =========================================================================
   ▼▼▼  EDITA SOLO ESTE BLOQUE  ▼▼▼
   Escribe aquí su historia. Todo en MAYÚSCULAS (la fuente es de Game Boy).
   Acentos permitidos: Á É Í Ó Ú Ñ ¿ ¡
   Máximo ~23 letras por renglón; el juego corta las líneas solo.
   ========================================================================= */
const HISTORIA = {
  titulo:    "6 MESES",
  subtitulo: "ANA & LUIS",
  fecha:     "12.08.2026",

  meses: [
    { escena:"parque", texto:"MES 1. AQUÍ TE VI POR PRIMERA VEZ. NO SABÍA QUE ESE DÍA CAMBIABA TODO." },
    { escena:"cine",   texto:"MES 2. NUESTRA PRIMERA PELÍCULA. NO ME ACUERDO DE LA TRAMA, SOLO DE TU MANO." },
    { escena:"lluvia", texto:"MES 3. NOS AGARRÓ EL AGUA Y NOS REÍMOS TODO EL CAMINO A CASA." },
    { escena:"noche",  texto:"MES 4. CONTAMOS ESTRELLAS EN LA AZOTEA Y ME CONTASTE TUS PLANES." },
    { escena:"casa",   texto:"MES 5. UN DOMINGO CUALQUIERA, EN EL SILLÓN. MI LUGAR FAVORITO." },
    { escena:"ciudad", texto:"MES 6. HOY. Y TODAVÍA ME LATE IGUAL DE FUERTE QUE EL PRIMER DÍA." }
  ],

  final: "SEIS MESES CONTIGO Y APENAS VAMOS EMPEZANDO. GRACIAS POR CADA UNO. TE AMO.",

  // Quién camina: "a" = pelo largo, "b" = pelo corto
  jugador: "a",
  pareja:  "b"
};
/* =========================================================================
   ▲▲▲  FIN DEL BLOQUE EDITABLE  ▲▲▲
   ========================================================================= */


/* ---------- Pantalla ---------- */
const cv = document.getElementById('lcd');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

// Paleta DMG original: 0 = más oscuro, 3 = más claro
const PAL = ['#0f380f', '#306230', '#8bac0f', '#9bbc0f'];

/* Escala la consola completa al espacio que de verdad hay.
   Mide la consola a escala 4 para saber cuánto ocupa en "unidades" y
   después elige la escala más grande que entra a lo ancho y a lo alto. */
const stage  = document.getElementById('stage');
const shell  = document.querySelector('.gb');
const rootEl = document.documentElement;
let UW = 0, UH = 0;

function medirUnidades() {
  rootEl.style.setProperty('--s', '4');
  const r = shell.getBoundingClientRect();
  UW = r.width / 4;
  UH = r.height / 4;
}
function fit() {
  if (!UW) medirUnidades();
  const s = Math.min(stage.clientWidth / UW, stage.clientHeight / UH);
  rootEl.style.setProperty('--s', Math.max(0.5, Math.min(6, Math.floor(s * 100) / 100)));
}
let fitPend = false;
function fitSoon() {
  if (fitPend) return;
  fitPend = true;
  requestAnimationFrame(() => { fitPend = false; fit(); });
}
addEventListener('resize', fitSoon);
addEventListener('orientationchange', () => setTimeout(fit, 250));
if (window.visualViewport) visualViewport.addEventListener('resize', fitSoon);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { UW = 0; fit(); });
fit();

function px(x, y, c) {
  if (c === null) return;
  ctx.fillStyle = PAL[c];
  ctx.fillRect(x | 0, y | 0, 1, 1);
}
function rect(x, y, w, h, c) {
  ctx.fillStyle = PAL[c];
  ctx.fillRect(x | 0, y | 0, w | 0, h | 0);
}


/* ---------- Fuente 5x7 (dibujada a mano, bit por bit) ---------- */
const FONT = {
  ' ':'00000000000000','A':'0E11111F111111','B':'1E11111E11111E','C':'0E11101010110E',
  'D':'1E11111111111E','E':'1F10101E10101F','F':'1F10101E101010','G':'0E11101711110E',
  'H':'1111111F111111','I':'0E04040404040E','J':'0702020202120C','K':'11121418141211',
  'L':'1010101010101F','M':'111B1515111111','N':'11191513111111','Ñ':'0A001119151311',
  'O':'0E11111111110E','P':'1E11111E101010','Q':'0E11111115120D','R':'1E11111E141211',
  'S':'0F10100E01011E','T':'1F040404040404','U':'1111111111110E','V':'11111111110A04',
  'W':'11111115151B11','X':'11110A040A1111','Y':'11110A04040404','Z':'1F01020408101F',
  'Á':'020E111F111111','É':'021F101E10101F','Í':'020E040404040E','Ó':'020E111111110E',
  'Ú':'0211111111110E',
  '0':'0E13151515190E','1':'040C040404040E','2':'0E11010204081F','3':'1F02040201110E',
  '4':'02060A121F0202','5':'1F101E0101110E','6':'0608101E11110E','7':'1F010204080808',
  '8':'0E11110E11110E','9':'0E11110F01020C',
  '.':'00000000000C0C',',':'000000000C0C08','!':'04040404040004','?':'0E110102040004',
  '¿':'0400040810110E','¡':'04000404040404','-':'0000001F000000',"'":'04040000000000',
  ':':'000C0C000C0C00','/':'01020204080810','(':'02040808080402',')':'08040202020408',
  '+':'0004041F040400','*':'000A041F040A00','&':'0C12120C15120D','"':'0A0A0000000000'
};
const GCACHE = {};
function glyph(ch) {
  if (GCACHE[ch]) return GCACHE[ch];
  const hex = FONT[ch] || FONT[' '];
  const rows = [];
  for (let i = 0; i < 7; i++) rows.push(parseInt(hex.substr(i * 2, 2), 16));
  return (GCACHE[ch] = rows);
}
function drawText(x, y, str, c) {
  str = (str || '').toUpperCase();
  for (let i = 0; i < str.length; i++) {
    const rows = glyph(str[i]);
    for (let r = 0; r < 7; r++)
      for (let col = 0; col < 5; col++)
        if ((rows[r] >> (4 - col)) & 1) px(x + i * 6 + col, y + r, c);
  }
}
function textW(s) { return (s || '').length * 6 - 1; }
function centerText(y, s, c) { drawText(Math.round((160 - textW(s)) / 2), y, s, c); }


/* ---------- Sprites ---------- */
const SPR_A = [ // pelo largo
  "....0000....","..00111100..",".0111111110.",".0113333110.",
  ".0110330110.",".0113333110.","..0011331100","...022220...",
  "..02222220..","..02222220..","..02222220..","..00222200..",
  "...011110...","...011110...","...01..10...","..000..000.."
];
const SPR_A2 = SPR_A.slice(0, 14).concat(["..01....10..", ".000....000."]);
const SPR_B = [ // pelo corto
  "...000000...","..01111110..",".0111111110.",".0133333310.",
  ".0130330310.",".0133333310.","..03333330..","...022220...",
  "..02222220..","..02222220..","..02222220..","..00222200..",
  "...011110...","...011110...","...01..10...","..000..000.."
];
const SPR_B2 = SPR_B.slice(0, 14).concat(["..01....10..", ".000....000."]);
const HEART = [".00..00.","00000000","00000000","00000000",".000000.","..0000..","...00..."];

function drawSprite(spr, x, y, flip) {
  for (let r = 0; r < spr.length; r++) {
    const row = spr[r];
    for (let c = 0; c < row.length; c++) {
      const ch = row[c];
      if (ch === '.') continue;
      px(x + (flip ? row.length - 1 - c : c), y + r, +ch);
    }
  }
}
const SETS = { a: [SPR_A, SPR_A2], b: [SPR_B, SPR_B2] };


/* ---------- Escenas (fondos dibujados a mano) ---------- */
const GROUND = 88;

function bgParque(t) {
  rect(0, 0, 160, GROUND, 3);
  for (let i = 0; i < 3; i++) {
    const cx = 18 + i * 58, base = GROUND;
    rect(cx - 2, base - 22, 5, 22, 1);
    rect(cx - 12, base - 42, 25, 18, 2);
    rect(cx - 9, base - 46, 19, 6, 2);
    rect(cx - 12, base - 42, 25, 1, 1);
    rect(cx - 9, base - 47, 19, 1, 1);
  }
  rect(96, GROUND - 14, 30, 3, 1);   // banca
  rect(96, GROUND - 22, 30, 2, 1);
  rect(98, GROUND - 14, 2, 14, 1);
  rect(122, GROUND - 14, 2, 14, 1);
  rect(0, GROUND, 160, 56, 2);
  rect(0, GROUND, 160, 2, 1);
  for (let i = 0; i < 26; i++) {
    const gx = (i * 13 + 5) % 158;
    px(gx, GROUND + 6 + (i % 4) * 9, 1);
    px(gx + 1, GROUND + 5 + (i % 4) * 9, 1);
  }
}

function bgCine(t) {
  rect(0, 0, 160, 144, 1);
  rect(20, 8, 120, 56, 0);
  rect(23, 11, 114, 50, 3);
  if ((t / 40 | 0) % 2) rect(46, 22, 68, 28, 2);
  rect(0, GROUND, 160, 56, 0);
  for (let row = 0; row < 2; row++)
    for (let i = 0; i < 6; i++) {
      const sx = 6 + i * 26, sy = GROUND + 8 + row * 22;
      rect(sx, sy, 20, 12, 1);
      rect(sx, sy - 4, 20, 5, 2);
    }
}

function bgLluvia(t) {
  rect(0, 0, 160, GROUND, 2);
  for (let i = 0; i < 6; i++) rect(10 + i * 28, 6 + (i % 3) * 7, 22, 5, 1);
  for (let i = 0; i < 40; i++) {
    const rx = (i * 37 + (t * 2)) % 168 - 8;
    const ry = (i * 23 + (t * 5)) % GROUND;
    px(rx, ry, 1); px(rx, ry + 1, 1); px(rx - 1, ry + 2, 1);
  }
  rect(0, GROUND, 160, 56, 1);
  rect(0, GROUND, 160, 2, 0);
  for (let i = 0; i < 5; i++) {
    const w = 16 + (i % 3) * 8;
    rect(8 + i * 32, GROUND + 14 + (i % 2) * 16, w, 3, 0);
  }
}

function bgNoche(t) {
  rect(0, 0, 160, GROUND, 0);
  for (let i = 0; i < 34; i++) {
    const sx = (i * 47) % 158, sy = (i * 29) % (GROUND - 20);
    if ((t / 18 + i) % 5 > 1.2) px(sx, sy, i % 3 ? 2 : 3);
  }
  rect(120, 10, 8, 8, 3); rect(118, 12, 8, 8, 0); // luna
  for (let i = 0; i < 8; i++) {
    const bw = 14 + (i % 3) * 6, bh = 16 + ((i * 7) % 20);
    rect(i * 20, GROUND - bh, bw, bh, 1);
  }
  rect(0, GROUND, 160, 56, 1);
  rect(0, GROUND, 160, 2, 0);
  rect(0, GROUND + 10, 160, 1, 0);
}

function bgCasa(t) {
  rect(0, 0, 160, GROUND, 3);
  rect(0, GROUND - 6, 160, 6, 2);
  rect(14, 10, 34, 30, 2); rect(14, 10, 34, 1, 0); rect(14, 39, 34, 1, 0);
  rect(30, 10, 1, 30, 0); rect(14, 24, 34, 1, 0);
  rect(14, 10, 1, 30, 0); rect(47, 10, 1, 30, 0);
  rect(96, 22, 30, 20, 1); rect(99, 25, 24, 14, 3); rect(108, 42, 6, 4, 0);
  rect(58, GROUND - 26, 46, 26, 1);   // sillón
  rect(58, GROUND - 32, 46, 8, 2);
  rect(58, GROUND - 26, 4, 26, 0);
  rect(100, GROUND - 26, 4, 26, 0);
  rect(0, GROUND, 160, 56, 2);
  rect(0, GROUND, 160, 2, 1);
  for (let i = 0; i < 8; i++) rect(i * 20, GROUND + 2, 1, 54, 1);
}

function bgCiudad(t) {
  rect(0, 0, 160, GROUND, 0);
  for (let f = 0; f < 3; f++) {
    const p = (t + f * 90) % 180;
    if (p < 60) {
      const cx = 30 + f * 50, cy = 22 + (f % 2) * 14, rad = p * 0.45;
      for (let a = 0; a < 12; a++) {
        const ang = a * Math.PI / 6;
        px(cx + Math.cos(ang) * rad, cy + Math.sin(ang) * rad, p < 34 ? 3 : 2);
      }
    }
  }
  for (let i = 0; i < 9; i++) {
    const bw = 16 + (i % 4) * 4, bh = 22 + ((i * 13) % 34);
    rect(i * 18, GROUND - bh, bw, bh, 1);
    for (let wy = GROUND - bh + 4; wy < GROUND - 4; wy += 7)
      for (let wx = i * 18 + 3; wx < i * 18 + bw - 3; wx += 6)
        if ((wx * wy + t / 30 | 0) % 3) px(wx, wy, 3);
  }
  rect(0, GROUND, 160, 56, 1);
  rect(0, GROUND, 160, 2, 0);
}

const ESCENAS = { parque:bgParque, cine:bgCine, lluvia:bgLluvia, noche:bgNoche, casa:bgCasa, ciudad:bgCiudad };


/* ---------- Caja de diálogo ---------- */
const BOX_Y = 96, MAXCH = 23;

function wrap(str) {
  const words = str.toUpperCase().split(/\s+/);
  const lines = []; let cur = '';
  for (const w of words) {
    if (!cur.length) cur = w;
    else if (cur.length + 1 + w.length <= MAXCH) cur += ' ' + w;
    else { lines.push(cur); cur = w; }
  }
  if (cur) lines.push(cur);
  const pages = [];
  for (let i = 0; i < lines.length; i += 3) pages.push(lines.slice(i, i + 3));
  return pages;
}

function drawBox(pages, page, revealed, blink) {
  rect(4, BOX_Y, 152, 44, 3);
  rect(4, BOX_Y, 152, 1, 0); rect(4, BOX_Y + 43, 152, 1, 0);
  rect(4, BOX_Y, 1, 44, 0);  rect(155, BOX_Y, 1, 44, 0);
  rect(6, BOX_Y + 2, 148, 1, 1); rect(6, BOX_Y + 41, 148, 1, 1);

  const lines = pages[page] || [];
  let count = 0;
  for (let i = 0; i < lines.length; i++) {
    let ln = lines[i];
    if (count + ln.length > revealed) ln = ln.slice(0, Math.max(0, revealed - count));
    count += (pages[page][i] || '').length;
    drawText(10, BOX_Y + 7 + i * 11, ln, 0);
  }
  const total = lines.join('').length;
  if (revealed >= total && blink) {
    rect(146, BOX_Y + 35, 5, 1, 0); rect(147, BOX_Y + 36, 3, 1, 0); rect(148, BOX_Y + 37, 1, 1, 0);
  }
}


/* ---------- Audio (chiptune con onda cuadrada) ---------- */
let AC = null, musicOn = false, musicStep = 0, musicTimer = null;
const N = {C4:261.63,D4:293.66,E4:329.63,F4:349.23,G4:392,A4:440,B4:493.88,
           C5:523.25,D5:587.33,E5:659.25,F5:698.46,G5:783.99,A5:880,B5:987.77,C6:1046.5};
const LEAD = ['E5','G5','A5','B5','A5','G5','E5',null,'D5','E5','G5','A5','G5','E5','D5',null,
              'C5','E5','G5','C6','B5','G5','E5',null,'D5','F5','A5','G5','E5','D5','C5',null];
const BASS = ['C4',null,null,null,'G4',null,null,null,'A4',null,null,null,'F4',null,null,null,
              'C4',null,null,null,'E4',null,null,null,'F4',null,null,null,'G4',null,null,null];

function tone(freq, dur, vol, type) {
  if (!AC || !freq) return;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'square'; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + dur);
  o.connect(g); g.connect(AC.destination);
  o.start(); o.stop(AC.currentTime + dur);
}
function tick() {
  if (!musicOn) return;
  tone(N[LEAD[musicStep % 32]], 0.16, 0.05, 'square');
  tone(N[BASS[musicStep % 32]], 0.30, 0.04, 'triangle');
  musicStep++;
  musicTimer = setTimeout(tick, 185);
}
function blip() { if (musicOn) tone(880, 0.03, 0.03, 'square'); }
function chime() { if (!musicOn) return; tone(N.G5, .09, .06); setTimeout(() => tone(N.C6, .16, .06), 95); }

const muteBtn = document.getElementById('mute');

/* iOS solo deja abrir el audio dentro de un toque real, y hay que
   "despertarlo" con un buffer mudo la primera vez. */
let audioListo = false;
function ensureAudio() {
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    if (!audioListo) {
      const src = AC.createBufferSource();
      src.buffer = AC.createBuffer(1, 1, 22050);
      src.connect(AC.destination); src.start(0);
      audioListo = true;
    }
  } catch (e) {}
}

muteBtn.onclick = () => {
  ensureAudio();
  musicOn = !musicOn;
  muteBtn.textContent = 'SONIDO: ' + (musicOn ? 'ON' : 'OFF');
  clearTimeout(musicTimer);
  if (musicOn) tick();
};


/* ---------- Controles ---------- */
const keys = {};
const pressed = {};
function setKey(k, v) {
  if (v && !keys[k]) pressed[k] = true;
  keys[k] = v;
}
document.querySelectorAll('[data-k]').forEach(b => {
  const k = b.dataset.k;
  const on = e => { e.preventDefault(); ensureAudio(); setKey(k, true); };
  const off = e => { e.preventDefault(); setKey(k, false); };
  b.addEventListener('touchstart', on, {passive:false});
  b.addEventListener('touchend', off, {passive:false});
  b.addEventListener('touchcancel', off, {passive:false});
  b.addEventListener('mousedown', on);
  b.addEventListener('mouseup', off);
  b.addEventListener('mouseleave', off);
});
const KMAP = {ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',
              z:'a',Z:'a',x:'b',X:'b',Enter:'start',' ':'a',Shift:'select'};
addEventListener('keydown', e => { if (KMAP[e.key]) { e.preventDefault(); ensureAudio(); setKey(KMAP[e.key], true); } });
addEventListener('keyup',   e => { if (KMAP[e.key]) { e.preventDefault(); setKey(KMAP[e.key], false); } });

/* Safari en iOS ignora maximum-scale: bloqueamos zoom y arrastre de la página */
addEventListener('touchmove', e => e.preventDefault(), {passive:false});
addEventListener('gesturestart', e => e.preventDefault());
addEventListener('dblclick', e => e.preventDefault());
function consumed(k) { if (pressed[k]) { pressed[k] = false; return true; } return false; }


/* ---------- Estado ---------- */
let estado = 'titulo';
let mes = 0, t = 0;
let jug = { x: 16, frame: 0, mirando: 1 };
let corazonTomado = false;
let pages = [], page = 0, revealed = 0, textTimer = 0;
let fade = 0, fadeDir = 0, pendiente = null;

function abrirDialogo(txt, tipo) {
  pages = wrap(txt); page = 0; revealed = 0; textTimer = 0;
  estado = tipo || 'dialogo'; chime();
}
/* Si ya hay un barrido corriendo se ignora: si no, la condición de salida
   se cumple en cada cuadro y reinicia el fade en 0 para siempre. */
function transicionar(fn) {
  if (fadeDir !== 0) return;
  fadeDir = 1; fade = 0; pendiente = fn;
}

/* Barrido de transición. Tiene que correr en TODAS las pantallas
   (título y créditos también salen por su propio return). */
function pasoFade() {
  if (fadeDir === 0) return;
  fade += fadeDir * 5;
  if (fadeDir === 1 && fade >= 160) {
    fade = 160; fadeDir = -1;
    if (pendiente) { pendiente(); pendiente = null; }
  } else if (fadeDir === -1 && fade <= 0) {
    fade = 0; fadeDir = 0; return;
  }
  if (fadeDir === 1) rect(0, 0, fade, 144, 0);
  else               rect(160 - fade, 0, fade, 144, 0);
}


/* ---------- Bucle principal ---------- */
function loop() {
  t++;
  ctx.clearRect(0, 0, 160, 144);

  if (estado === 'titulo') {
    rect(0, 0, 160, 144, 3);
    for (let i = 0; i < 160; i += 8) rect(i, 0, 4, 144, (i / 8) % 2 ? 3 : 2);
    rect(10, 26, 140, 78, 3);
    rect(10, 26, 140, 1, 0); rect(10, 103, 140, 1, 0);
    rect(10, 26, 1, 78, 0); rect(149, 26, 1, 78, 0);
    centerText(38, HISTORIA.titulo, 0);
    drawSprite(HEART, 40, 34, false);
    drawSprite(HEART, 112, 34, false);
    centerText(56, HISTORIA.subtitulo, 1);
    centerText(70, HISTORIA.fecha, 1);
    if ((t / 30 | 0) % 2) centerText(88, "PRESIONA A", 0);
    centerText(120, "-- LADO A --", 1);
    if (consumed('a') || consumed('start')) {
      ensureAudio();
      if (!musicOn) muteBtn.click();
      mes = 0; jug.x = 16; corazonTomado = false;
      transicionar(() => { estado = 'juego'; });
    }
    pasoFade();
    requestAnimationFrame(loop); return;
  }

  if (estado === 'creditos') {
    rect(0, 0, 160, 144, 0);
    centerText(30, "FELICES", 3);
    centerText(44, "6 MESES", 3);
    for (let i = 0; i < 7; i++) {
      const hx = 12 + i * 21, hy = 66 + Math.sin(t / 22 + i) * 6;
      drawSprite(HEART, hx, hy, false);
      rect(hx, hy, 8, 7, 2);
      for (let r = 0; r < 7; r++) for (let c = 0; c < 8; c++)
        if (HEART[r][c] === '0') px(hx + c, hy + r, 3);
    }
    centerText(94, HISTORIA.subtitulo, 2);
    if ((t / 30 | 0) % 2) centerText(118, "A = OTRA VEZ", 2);
    if (consumed('a') || consumed('start')) transicionar(() => { estado = 'titulo'; });
    pasoFade();
    requestAnimationFrame(loop); return;
  }

  // --- Escena de juego ---
  const esFinal = (estado === 'final' || estado === 'dialogoFinal');
  const datosMes = HISTORIA.meses[mes];
  const key = (esFinal || !datosMes) ? 'ciudad' : datosMes.escena;
  (ESCENAS[key] || bgParque)(t);

  if (esFinal) {
    const ps = SETS[HISTORIA.pareja][0];
    drawSprite(ps, 108, GROUND - 16, true);
  } else if (!corazonTomado) {
    const hy = GROUND - 42 + Math.sin(t / 16) * 3;
    drawSprite(HEART, 122, hy, false);
  } else {
    // flecha de salida
    if ((t / 20 | 0) % 2) {
      for (let i = 0; i < 6; i++) rect(146, GROUND - 30 + i, 6 - i, 1, 0);
      rect(146, GROUND - 24, 8, 1, 0);
    }
  }

  // jugador
  const set = SETS[HISTORIA.jugador];
  const moviendo = (estado === 'juego' || estado === 'final') && (keys.left || keys.right);
  const spr = moviendo && (t / 8 | 0) % 2 ? set[1] : set[0];
  drawSprite(spr, Math.round(jug.x), GROUND - 16, jug.mirando < 0);

  // HUD
  if (!esFinal) {
    rect(4, 4, 52, 13, 3);
    rect(4, 4, 52, 1, 0); rect(4, 16, 52, 1, 0);
    rect(4, 4, 1, 13, 0); rect(55, 4, 1, 13, 0);
    drawText(8, 7, "MES " + (mes + 1) + "/" + HISTORIA.meses.length, 0);
  }

  if (estado === 'juego' || estado === 'final') {
    if (keys.left)  { jug.x -= 0.9; jug.mirando = -1; }
    if (keys.right) { jug.x += 0.9; jug.mirando = 1; }
    jug.x = Math.max(4, Math.min(144, jug.x));

    if (estado === 'juego' && !corazonTomado && Math.abs(jug.x - 118) < 14) {
      corazonTomado = true;
      abrirDialogo(HISTORIA.meses[mes].texto);
    }
    if (estado === 'juego' && corazonTomado && jug.x >= 143) {
      transicionar(() => {
        mes++; jug.x = 8; corazonTomado = false;
        if (mes >= HISTORIA.meses.length) estado = 'final';
        else estado = 'juego';
      });
    }
    if (estado === 'final' && jug.x >= 92) {
      abrirDialogo(HISTORIA.final, 'dialogoFinal');
    }
  }

  if (estado === 'dialogo' || estado === 'dialogoFinal') {
    const total = (pages[page] || []).join('').length;
    if (revealed < total) {
      textTimer++;
      if (textTimer % 2 === 0) { revealed++; if (revealed % 3 === 0) blip(); }
    }
    drawBox(pages, page, revealed, (t / 22 | 0) % 2);

    if (consumed('a') || consumed('b')) {
      if (revealed < total) revealed = total;
      else if (page < pages.length - 1) { page++; revealed = 0; }
      else {
        if (estado === 'dialogoFinal') transicionar(() => { estado = 'creditos'; });
        else estado = 'juego';
      }
    }
  }

  // transición (barrido)
  pasoFade();

  requestAnimationFrame(loop);
}
loop();
</script>
