<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>6 MESES</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="6 MESES">
<meta name="theme-color" content="#17121f">
<link rel="apple-touch-icon" href="icon.png">
<style>
  /* --s la fija fit() en JS: es cuántos px de pantalla mide 1 píxel de Game Boy.
     TODA la consola está medida en esa unidad, así que crece y encoge junta. */
  :root { --s:2; --u:calc(var(--s) * 1px); }

  * { margin:0; padding:0; box-sizing:border-box;
      -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none; }
  html, body {
    height:100%; overflow:hidden; overscroll-behavior:none;
    background:
      radial-gradient(120% 90% at 50% 0%, #2a1f3d 0%, #17121f 55%, #0d0a13 100%);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    -webkit-text-size-adjust:100%;
    touch-action:none; user-select:none; -webkit-user-select:none;
  }

  /* Área realmente visible: descuenta Dynamic Island, barras y home indicator */
  #stage {
    position:fixed; overflow:hidden;
    top:   calc(env(safe-area-inset-top,    0px) + 6px);
    right: calc(env(safe-area-inset-right,  0px) + 6px);
    bottom:calc(env(safe-area-inset-bottom, 0px) + 6px);
    left:  calc(env(safe-area-inset-left,   0px) + 6px);
    display:flex; align-items:center; justify-content:center;
  }

  /* ---------- Carcasa Game Boy Color (uva translúcido) ---------- */
  .gb {
    flex:0 0 auto; position:relative;
    background:
      radial-gradient(120% 70% at 18% 2%,  rgba(255,255,255,.38), rgba(255,255,255,0) 52%),
      radial-gradient(90%  60% at 88% 96%, rgba(255,255,255,.14), rgba(255,255,255,0) 60%),
      linear-gradient(158deg,#9463d6 0%,#7b49c0 32%,#5f34a0 62%,#41236f 100%);
    border-radius:calc(9*var(--u)) calc(9*var(--u)) calc(12*var(--u)) calc(12*var(--u));
    padding:calc(7*var(--u)) calc(7*var(--u)) calc(7*var(--u));
    box-shadow:
      0 calc(9*var(--u)) calc(22*var(--u)) rgba(0,0,0,.62),
      0 calc(2*var(--u)) calc(5*var(--u))  rgba(0,0,0,.45),
      inset 0 calc(1.5*var(--u)) 0 rgba(255,255,255,.55),
      inset 0 calc(-2*var(--u)) 0 rgba(0,0,0,.32),
      inset calc(2.5*var(--u)) 0 calc(7*var(--u)) rgba(255,255,255,.13),
      inset calc(-2.5*var(--u)) 0 calc(7*var(--u)) rgba(0,0,0,.28);
    display:flex; flex-direction:column; align-items:center; gap:calc(3*var(--u));
  }
  /* brillo de plástico que cruza la carcasa */
  .gb::after {
    content:""; position:absolute; inset:0; pointer-events:none; border-radius:inherit;
    background:linear-gradient(112deg,
      rgba(255,255,255,.20) 0%, rgba(255,255,255,.06) 18%,
      rgba(255,255,255,0) 34%, rgba(255,255,255,0) 74%,
      rgba(255,255,255,.07) 92%);
    mix-blend-mode:screen;
  }

  /* fila superior: interruptor de encendido */
  .top { width:100%; display:flex; align-items:center; padding:0 calc(3*var(--u)); gap:calc(2*var(--u)); }
  .power {
    width:calc(17*var(--u)); height:calc(4.5*var(--u)); border-radius:calc(2.5*var(--u));
    background:linear-gradient(180deg,#efeaf5,#b6acc6);
    box-shadow:inset 0 calc(-1*var(--u)) 0 rgba(0,0,0,.28),
               inset 0 calc(.8*var(--u)) 0 rgba(255,255,255,.9),
               0 calc(.8*var(--u)) calc(1.5*var(--u)) rgba(0,0,0,.35);
    position:relative;
  }
  .power::after {
    content:""; position:absolute; left:calc(2*var(--u)); top:calc(1*var(--u));
    width:calc(6*var(--u)); height:calc(2.5*var(--u)); border-radius:calc(1.5*var(--u));
    background:linear-gradient(180deg,#8e83a5,#6d6382);
  }
  .powerlbl { font-size:calc(2.6*var(--u)); letter-spacing:calc(.35*var(--u)); color:rgba(255,255,255,.55); }

  /* ---------- Bisel + pantalla ---------- */
  .bezel {
    background:linear-gradient(168deg,#3a3648 0%,#26232f 45%,#1a1822 100%);
    border-radius:calc(4*var(--u)) calc(4*var(--u)) calc(9*var(--u)) calc(9*var(--u));
    padding:calc(8*var(--u)) calc(10*var(--u)) calc(7*var(--u)); position:relative;
    box-shadow:inset 0 calc(1.2*var(--u)) calc(3*var(--u)) rgba(0,0,0,.75),
               inset 0 calc(-1*var(--u)) 0 rgba(255,255,255,.10),
               0 calc(1*var(--u)) 0 rgba(255,255,255,.16);
  }
  .lamp {
    position:absolute; left:calc(3.5*var(--u)); top:calc(24*var(--u));
    width:calc(3.4*var(--u)); height:calc(3.4*var(--u)); border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#ff9a92,#e0332c);
    box-shadow:0 0 calc(3.5*var(--u)) rgba(255,70,60,.9), 0 0 calc(8*var(--u)) rgba(255,70,60,.45);
    animation:latido 2.4s ease-in-out infinite;
  }
  @keyframes latido { 0%,100%{opacity:1} 50%{opacity:.62} }
  .lamplbl {
    position:absolute; left:calc(1.2*var(--u)); top:calc(29*var(--u)); width:calc(8*var(--u));
    font-size:calc(2.2*var(--u)); color:#7f7a90; text-align:center; letter-spacing:0;
  }

  .screen { position:relative; line-height:0; border-radius:calc(1*var(--u)); overflow:hidden;
            box-shadow:0 0 calc(6*var(--u)) rgba(120,190,255,.10); }
  canvas {
    display:block; image-rendering:pixelated; image-rendering:crisp-edges;
    background:#101a2c;
    width:calc(160*var(--u)); height:calc(144*var(--u));
  }
  /* rejilla de píxeles del LCD */
  .screen::after {
    content:""; position:absolute; inset:0; pointer-events:none; z-index:2;
    background:
      repeating-linear-gradient(to right,  rgba(0,0,0,.16) 0 1px, rgba(0,0,0,0) 1px var(--u)),
      repeating-linear-gradient(to bottom, rgba(0,0,0,.16) 0 1px, rgba(0,0,0,0) 1px var(--u));
    opacity:.42;
  }
  /* reflejo de cristal + viñeta */
  .screen::before {
    content:""; position:absolute; inset:0; pointer-events:none; z-index:3;
    background:
      linear-gradient(118deg, rgba(255,255,255,.18) 0%, rgba(255,255,255,.05) 20%,
                              rgba(255,255,255,0) 40%, rgba(255,255,255,0) 100%);
    box-shadow:inset 0 0 calc(9*var(--u)) rgba(0,0,0,.45);
  }

  /* ---------- Logo GAME BOY COLOR ---------- */
  .logo {
    width:100%; display:flex; align-items:baseline; gap:calc(2*var(--u));
    padding:calc(1*var(--u)) calc(4*var(--u)) 0;
  }
  .logo .gbtxt {
    font-size:calc(5*var(--u)); font-weight:800; font-style:italic;
    letter-spacing:calc(.2*var(--u)); color:#211a3a;
    text-shadow:0 calc(.6*var(--u)) 0 rgba(255,255,255,.28);
  }
  .logo .color { font-size:calc(5*var(--u)); font-weight:800; font-style:italic; letter-spacing:calc(.2*var(--u)); }
  .logo .color i { font-style:italic; }
  .logo .color i:nth-child(1){ color:#e8443c }
  .logo .color i:nth-child(2){ color:#f08a2a }
  .logo .color i:nth-child(3){ color:#e8c72a }
  .logo .color i:nth-child(4){ color:#4bb35a }
  .logo .color i:nth-child(5){ color:#3d7fe0 }
  .logo .nos {
    margin-left:auto; font-size:calc(3.2*var(--u)); letter-spacing:calc(.4*var(--u));
    color:rgba(255,255,255,.62); font-weight:700;
  }

  /* ---------- Controles ---------- */
  .pad {
    display:flex; align-items:center; justify-content:space-between;
    width:100%; padding:calc(2*var(--u)) calc(2*var(--u)) 0;
  }

  .dpad {
    position:relative; width:calc(54*var(--u)); height:calc(54*var(--u));
    border-radius:50%;
    background:radial-gradient(circle at 50% 46%, #2f2b3a 62%, #241f2e 100%);
    box-shadow:inset 0 calc(1.5*var(--u)) calc(2.5*var(--u)) rgba(0,0,0,.55),
               0 calc(1*var(--u)) 0 rgba(255,255,255,.18);
    display:flex; align-items:center; justify-content:center;
  }
  .dpad button, .dpad .c {
    position:absolute; border:0; color:#9c96ad; font-size:calc(6*var(--u)); line-height:1;
    background:linear-gradient(160deg,#413c50,#2a2634);
  }
  .dpad button { box-shadow:0 calc(1.4*var(--u)) 0 #171420, inset 0 calc(.8*var(--u)) 0 rgba(255,255,255,.13); }
  .dpad .u { left:calc(18*var(--u)); top:calc(3*var(--u));    width:calc(18*var(--u)); height:calc(17*var(--u)); border-radius:calc(3*var(--u)) calc(3*var(--u)) 0 0; }
  .dpad .d { left:calc(18*var(--u)); bottom:calc(3*var(--u)); width:calc(18*var(--u)); height:calc(17*var(--u)); border-radius:0 0 calc(3*var(--u)) calc(3*var(--u)); }
  .dpad .l { top:calc(18*var(--u)); left:calc(3*var(--u));    width:calc(17*var(--u)); height:calc(18*var(--u)); border-radius:calc(3*var(--u)) 0 0 calc(3*var(--u)); }
  .dpad .r { top:calc(18*var(--u)); right:calc(3*var(--u));   width:calc(17*var(--u)); height:calc(18*var(--u)); border-radius:0 calc(3*var(--u)) calc(3*var(--u)) 0; }
  .dpad .c {
    left:calc(18*var(--u)); top:calc(18*var(--u)); width:calc(18*var(--u)); height:calc(18*var(--u));
    background:radial-gradient(circle at 50% 40%, #3b3648, #262232);
    box-shadow:inset 0 0 calc(2*var(--u)) rgba(0,0,0,.6);
  }

  .ab { display:flex; gap:calc(7*var(--u)); align-items:center; transform:rotate(-22deg); }
  .ab .btnwrap { display:flex; flex-direction:column; align-items:center; gap:calc(1.5*var(--u)); }
  .ab button {
    width:calc(24*var(--u)); height:calc(24*var(--u)); border-radius:50%; border:0;
    background:radial-gradient(circle at 34% 28%, #6b3f8f 0%, #4a2668 48%, #2d1442 100%);
    color:#f0e2ff; font-size:calc(8*var(--u)); font-weight:800; line-height:1;
    box-shadow:0 calc(2*var(--u)) 0 #1d0d2c,
               inset 0 calc(1*var(--u)) 0 rgba(255,255,255,.30),
               inset 0 calc(-1.5*var(--u)) calc(1.5*var(--u)) rgba(0,0,0,.45);
    text-shadow:0 calc(.6*var(--u)) 0 rgba(0,0,0,.5);
  }
  button:active { transform:translateY(calc(1.2*var(--u))); box-shadow:none !important; }
  .ab button:active { transform:translateY(calc(1.2*var(--u))); }

  .bottom {
    width:100%; display:flex; align-items:flex-end; justify-content:space-between;
    padding:calc(3*var(--u)) calc(3*var(--u)) 0;
  }
  .sys { display:flex; gap:calc(9*var(--u)); padding-left:calc(6*var(--u)); }
  .sys button {
    position:relative;
    width:calc(26*var(--u)); height:calc(6.5*var(--u));
    border-radius:calc(4*var(--u)); border:0;
    background:linear-gradient(180deg,#a9a2bb,#7c7590);
    transform:rotate(-22deg);
    box-shadow:0 calc(1.4*var(--u)) 0 #4e4860, inset 0 calc(.8*var(--u)) 0 rgba(255,255,255,.45);
  }
  /* área táctil generosa sin agrandar el botón dibujado */
  .sys button::before { content:""; position:absolute; inset:calc(-8*var(--u)) calc(-5*var(--u)); }
  .sys .lbl {
    font-size:calc(3.6*var(--u)); color:rgba(255,255,255,.60); letter-spacing:calc(.5*var(--u));
    text-align:center; margin-top:calc(4*var(--u)); font-weight:700;
  }
  .sysgroup { display:flex; flex-direction:column; align-items:center; }

  .speaker { display:grid; grid-template-columns:repeat(3,calc(4.5*var(--u))); gap:calc(3.5*var(--u));
             transform:rotate(-22deg); padding:calc(2*var(--u)) calc(2*var(--u)); }
  .speaker i {
    width:calc(4.5*var(--u)); height:calc(4.5*var(--u)); border-radius:50%;
    background:#2a2338;
    box-shadow:inset 0 calc(1*var(--u)) calc(1*var(--u)) rgba(0,0,0,.85),
               0 calc(.8*var(--u)) 0 rgba(255,255,255,.20);
  }

  .mute, .reset, .escenas {
    position:fixed; z-index:5;
    top:  calc(env(safe-area-inset-top,   0px) + 8px);
    right:calc(env(safe-area-inset-right, 0px) + 10px);
    min-height:40px; padding:10px 13px;
    background:rgba(148,99,214,.18); color:#d9c2ff;
    border:1px solid rgba(217,194,255,.35);
    border-radius:10px; font-size:11px; font-family:inherit; font-weight:700;
    letter-spacing:.5px;
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  }
  .reset {
    right:auto;
    left:calc(env(safe-area-inset-left, 0px) + 10px);
    background:rgba(232,53,92,.16); color:#ffbfd0;
    border-color:rgba(255,191,208,.35);
  }
  .reset:active { background:rgba(232,53,92,.34); }
  /* Selector de escenas: quítalo antes de regalarlo si no lo quieres */
  .escenas {
    right:auto;
    left:calc(env(safe-area-inset-left, 0px) + 10px);
    top:calc(env(safe-area-inset-top, 0px) + 56px);
    background:rgba(120,200,255,.14); color:#bfe4ff;
    border-color:rgba(191,228,255,.35);
  }
  .escenas:active { background:rgba(120,200,255,.32); }
</style>
</head>
<body>

<button class="reset" id="reset">REINICIAR</button>
<button class="escenas" id="escenas">ESCENAS</button>
<button class="mute" id="mute">SONIDO: OFF</button>

<div id="stage">
<div class="gb">

  <div class="top">
    <div class="power"></div>
    <div class="powerlbl">OFF&nbsp;&#9679;&nbsp;ON</div>
  </div>

  <div class="bezel">
    <div class="lamp"></div>
    <div class="lamplbl">POWER</div>
    <div class="screen"><canvas id="lcd" width="160" height="144"></canvas></div>
  </div>

  <div class="logo">
    <span class="gbtxt">GAME BOY</span>
    <span class="color"><i>C</i><i>O</i><i>L</i><i>O</i><i>R</i></span>

  </div>

  <div class="pad">

      <button class="u" data-k="up">&#9650;</button>

      <button class="r" data-k="right">&#9654;</button>

      <div class="sysgroup"><button data-k="select"></button><div class="lbl">SELECT</div></div>
      <div class="sysgroup"><button data-k="start"></button><div class="lbl">START</div></div>
    </div>
    <div class="speaker"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  </div>

</div>
</div>

<script>
/* =========================================================================
   ▼▼▼  EDITA SOLO ESTE BLOQUE  ▼▼▼
   Escribe aquí su historia. Todo en MAYÚSCULAS (la fuente es de Game Boy).
   Acentos permitidos: Á É Í Ó Ú Ñ ¿ ¡
   Máximo ~23 letras por renglón; el juego corta las líneas solo.

   escena: "patio" | "parque" | "cine" | "lluvia" | "noche" | "casa" |
           "cabana" | "ciudad" | "cuarto"
   Un mes puede traer "texto" (una sola frase tuya) O "charla", que es
   ida y vuelta: [{q:"roberto", t:"..."}, {q:"santiago", t:"..."}]
   Si trae "pareja: X", Roberto te está esperando parado en la x = X.
   ========================================================================= */
const HISTORIA = {
  titulo:    "6 MESES",
  subtitulo: "SANTIAGO & ROBERTO",
  fecha:     "12.08.2026",

  meses: [
    { escena:"patio", pareja:104, acto:true, charla:[
      { q:"roberto",  t:"HOLA. ¿ENTRAMOS?" },
      { q:"roberto",  t:"(QUÉ FEA CANGURERA.)" }
    ]},
    { escena:"cine",   texto:"MES 2. FUIMOS AL CINE. NO ME ACUERDO DE LA PELÍCULA." },
    { escena:"lluvia", texto:"MES 3. NOS AGARRÓ LA LLUVIA SIN PARAGUAS Y NOS FUIMOS CAMINANDO." },
    { escena:"noche",  texto:"MES 4. AZOTEA, DOS DE LA MAÑANA. ME CONTASTE TUS PLANES." },
    { escena:"casa",   texto:"MES 5. DOMINGO ENTERO EN EL SILLÓN SIN HACER NADA." },
    { escena:"cabana", texto:"MES 6. HOY. SEGUIMOS AQUÍ." }
  ],

  final: "SEIS MESES. NADA MAL PARA ALGUIEN CUYO PLAN IDEAL ERA GOING OUT AND BLACKING OUT.",

  // Quién camina y quién espera. Si los sprites salieran al revés,
  // intercambia estos dos valores y ya.
  jugador: "santiago",
  pareja:  "roberto"
};
/* =========================================================================
   ▲▲▲  FIN DEL BLOQUE EDITABLE  ▲▲▲
   ========================================================================= */


/* ---------- Pantalla ---------- */
const cv = document.getElementById('lcd');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

/* Escala la consola completa al espacio que de verdad hay.
   Mide la consola a escala 4 para saber cuánto ocupa en "unidades" y
   después elige la escala más grande que entra a lo ancho y a lo alto. */
const stage  = document.getElementById('stage');
const shell  = document.querySelector('.gb');
const rootEl = document.documentElement;
let UW = 0, UH = 0;

function medirUnidades() {
  rootEl.style.setProperty('--s', '4');
  const r = shell.getBoundingClientRect();
  UW = r.width / 4;
  UH = r.height / 4;
}
function fit() {
  if (!UW) medirUnidades();
  const s = Math.min(stage.clientWidth / UW, stage.clientHeight / UH);
  rootEl.style.setProperty('--s', Math.max(0.5, Math.min(6, Math.floor(s * 100) / 100)));
}
let fitPend = false;
function fitSoon() {
  if (fitPend) return;
  fitPend = true;
  requestAnimationFrame(() => { fitPend = false; fit(); });
}
addEventListener('resize', fitSoon);
addEventListener('orientationchange', () => setTimeout(fit, 250));
if (window.visualViewport) visualViewport.addEventListener('resize', fitSoon);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { UW = 0; fit(); });
fit();


/* ---------- Primitivas de dibujo (ahora a color) ---------- */
function R(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(x|0, y|0, w|0, h|0); }
function P(x, y, c)       { ctx.fillStyle = c; ctx.fillRect(x|0, y|0, 1, 1); }

/* Trama de medio tono: así se ven los degradados en consolas de 8 bits */
function dith(x, y, w, c, ph) {
  ctx.fillStyle = c;
  for (let i = 0; i < w; i++) if (((i + ph) & 1) === 0) ctx.fillRect((x + i)|0, y|0, 1, 1);
}
/* Degradado vertical en bandas, con las costuras tramadas */
function vgrad(x, y, w, h, cols) {
  const n = cols.length;
  for (let i = 0; i < n; i++) {
    const a = y + Math.round(h * i / n), b = y + Math.round(h * (i + 1) / n);
    R(x, a, w, b - a, cols[i]);
    if (i) { dith(x, a, w, cols[i-1], 0); dith(x, a + 1, w, cols[i-1], 1); }
  }
}
function elipse(cx, cy, rx, ry, c) {
  ctx.fillStyle = c;
  for (let yy = -ry; yy <= ry; yy++) {
    const t = 1 - (yy * yy) / (ry * ry);
    if (t < 0) continue;
    const half = Math.floor(rx * Math.sqrt(t));
    ctx.fillRect((cx - half)|0, (cy + yy)|0, half * 2 + 1, 1);
  }
}
function disco(cx, cy, r, c) { elipse(cx, cy, r, r, c); }
function sombraPiso(cx, cy) {
  elipse(cx, cy, 9, 3, 'rgba(24,10,44,.26)');
  elipse(cx, cy, 6, 2, 'rgba(24,10,44,.22)');
}


/* ---------- Fuente 5x7 (dibujada a mano, bit por bit) ---------- */
const FONT = {
  ' ':'00000000000000','A':'0E11111F111111','B':'1E11111E11111E','C':'0E11101010110E',
  'D':'1E11111111111E','E':'1F10101E10101F','F':'1F10101E101010','G':'0E11101711110E',
  'H':'1111111F111111','I':'0E04040404040E','J':'0702020202120C','K':'11121418141211',
  'L':'1010101010101F','M':'111B1515111111','N':'11191513111111','Ñ':'0A001119151311',
  'O':'0E11111111110E','P':'1E11111E101010','Q':'0E11111115120D','R':'1E11111E141211',
  'S':'0F10100E01011E','T':'1F040404040404','U':'1111111111110E','V':'11111111110A04',
  'W':'11111115151B11','X':'11110A040A1111','Y':'11110A04040404','Z':'1F01020408101F',
  'Á':'06000E111F1111','É':'06001F101E101F','Í':'06000E0404040E','Ó':'06000E1111110E',
  'Ú':'0600111111110E','∞':'001B15151B0000',
  '0':'0E13151515190E','1':'040C040404040E','2':'0E11010204081F','3':'1F02040201110E',
  '4':'02060A121F0202','5':'1F101E0101110E','6':'0608101E11110E','7':'1F010204080808',

const GCACHE = {};
function glyph(ch) {
  if (GCACHE[ch]) return GCACHE[ch];
  const hex = FONT[ch] || FONT[' '];
  const rows = [];
  for (let i = 0; i < 7; i++) rows.push(parseInt(hex.substr(i * 2, 2), 16));
  return (GCACHE[ch] = rows);
}
function drawText(x, y, str, c) {
  str = (str || '').toUpperCase();
  ctx.fillStyle = c;
  for (let i = 0; i < str.length; i++) {
    const rows = glyph(str[i]);
    for (let r = 0; r < 7; r++)
      for (let col = 0; col < 5; col++)
        if ((rows[r] >> (4 - col)) & 1) ctx.fillRect((x + i * 6 + col)|0, (y + r)|0, 1, 1);
  }
}
/* Texto con sombra dura: da profundidad y se lee sobre cualquier fondo */
function drawTextS(x, y, str, c, sombra) {
  if (sombra) drawText(x + 1, y + 1, str, sombra);
  drawText(x, y, str, c);
}
function textW(s) { return (s || '').length * 6 - 1; }
/* El mismo tipo de letra pero a lo grande, para los carteles */
function drawTextG(x, y, str, c, esc) {
  str = (str || '').toUpperCase();
  ctx.fillStyle = c;
  for (let i = 0; i < str.length; i++) {
    const rows = glyph(str[i]);
    for (let r = 0; r < 7; r++)
      for (let col = 0; col < 5; col++)
        if ((rows[r] >> (4 - col)) & 1)
          ctx.fillRect((x + i * 6 * esc + col * esc)|0, (y + r * esc)|0, esc, esc);
  }
}
function centerTextG(y, s, c, sombra, esc) {
  const x = Math.round((160 - (s.length * 6 * esc - esc)) / 2);
  if (sombra) drawTextG(x + esc, y + esc, s, sombra, esc);
  drawTextG(x, y, s, c, esc);
}
function centerText(y, s, c, sombra) { drawTextS(Math.round((160 - textW(s)) / 2), y, s, c, sombra); }

/* ---- Brazos para bailar: se pintan encima, en las columnas libres ---- */
function franjaBrazos(izq, der) {
  const f = [];
  for (let r = 0; r < 14; r++) {
    const a = izq(r) ? izq(r) : '..';
    const b = der(r) ? der(r) : '..';
    f.push(a + '............' + b);
  }
  return f;
}
const alto = r => r < 6 ? null : (r === 6 ? 'ss' : 'cc');
const BR_ARRIBA = franjaBrazos(alto, alto);
const BR_IZQ = franjaBrazos(alto, () => null);
const BR_DER = franjaBrazos(() => null, alto);
const MANOS_CABEZA = [
  "................",

  "...sss....sss...",

];
const NOTAS = ['*', '+', '*'];
function bailando(quien, x, y, t, tipo) {
  const p = PERSONAJES[quien];
  const f = (t / 7 | 0);
  let dy = 0, dx = 0, capa = null, mueve = f % 2 === 1;
  if (tipo === 'macarena') {
    capa = [BR_ARRIBA, MANOS_CABEZA, BR_ARRIBA, null][f % 4];
    dy = (f % 2) ? -1 : 0; mueve = false;
  } else if (tipo === 'payaso') {
    capa = (f % 2) ? BR_IZQ : BR_DER;
    dy = (f % 2) ? -3 : 0;
  } else {
    capa = (f % 2) ? BR_DER : BR_IZQ;
    dx = (f % 2) ? 1 : -1;
  }
  sombraPiso(Math.round(x) + 8, y + 30);
  drawSprite(mueve ? p.paso : p.quieto, Math.round(x + dx), y + dy, false, p.color);
  if (capa) drawSprite(capa, Math.round(x + dx), y + dy, false, p.color);
  if (cangurera && quien === 'santiago') pintaCangurera(Math.round(x + dx), y + dy, false);
  for (let i = 0; i < 3; i++) {
    const a = ((t / 3 | 0) + i * 7) % 24;
    if (a < 12) drawText(x - 4 + i * 11, y - 4 - a, NOTAS[i], i % 2 ? '#ffe08a' : '#7ee8fa');
  }
}

function drawSprite(spr, x, y, flip, map) {
  for (let r = 0; r < spr.length; r++) {
    const row = spr[r];
    for (let c = 0; c < row.length; c++) {
      const ch = row[c];
      if (ch === '.') continue;
      const col = map[ch];
      if (!col) continue;
      P(x + (flip ? row.length - 1 - c : c), y + r, col);
    }
  }
}

/* =========================================================================
   ESCENAS
   Cada una se dibuja en tres capas para que haya profundidad:
   fondo lejano (claro y desaturado) -> capa media -> piso -> frente.
   Lo del "frente" se pinta DESPUÉS de los personajes, así se meten dentro
   del decorado en vez de quedar pegados encima.
   ========================================================================= */
const GROUND = 92;

function nube(x, y, e, c1, c2) {
  elipse(x,          y,           Math.round(6*e), Math.round(3*e), c1);
  elipse(x + 7*e|0,  y - 2*e|0,   Math.round(8*e), Math.round(4*e), c1);
  elipse(x + 15*e|0, y,           Math.round(6*e), Math.round(3*e), c1);
  R(x - 5*e, y + 2*e, 26*e, 1, c2);
}
function arbol(cx, base, e, cop, copL, copS, tr, trS) {
  const h = Math.round(15*e), w = Math.round(12*e), hh = Math.round(9*e);
  R(cx - 2, base - h, 4, h, tr);
  R(cx - 2, base - h, 1, h, trS);
  elipse(cx, base - h - Math.round(4*e), w, hh, copS);
  elipse(cx, base - h - Math.round(6*e), w - 1, hh - 1, cop);
  elipse(cx - Math.round(4*e), base - h - Math.round(9*e), Math.round(w*0.45), Math.round(hh*0.45), copL);
}

  dith(0, GROUND - 17, 160, '#b0e3b4', 0);

function explosion(cx, cy, p) {
  /* el humo va detrás, si no tapa el centro de la bola */
  if (p > 18) {
    for (let i = 0; i < 8; i++) {
      const a = i * 0.85, d = (p - 18) * 1.3;
      elipse(cx + Math.cos(a) * d, cy + Math.sin(a) * d * .65 - (p - 18) * 0.7,
             6 + (i % 3) * 2, 5 + (i % 2) * 2, i % 2 ? '#4a3a44' : '#63505b');
    }
  }
  if (p < 34) {
    const r = 4 + p * 1.35;
    elipse(cx, cy, r, r * .85, '#7a2620');
    elipse(cx, cy, r * .82, r * .70, '#e8433c');
    elipse(cx, cy, r * .60, r * .50, '#ff9b3a');
    elipse(cx, cy, r * .38, r * .32, '#ffe86b');
    if (p < 18) elipse(cx, cy, r * .20, r * .16, '#ffffff');
  }
  for (let i = 0; i < 12; i++) {
    const a = i * 0.52 + 0.2, d = p * 1.7;
    const x = cx + Math.cos(a) * d, y = cy + Math.sin(a) * d * .6 + p * p * 0.018;
    if (y < 148) R(x, y, 2, 2, i % 3 ? '#3a2f38' : '#c9553c');
  }
}

/* ---- 15. EL VIAJE A PUERTO ESCONDIDO ----
   Un solo fondo con cinco temas: la ciudad, la carretera, el desierto,
   la Antártida y el fondo del mar. Todo se desplaza a la izquierda para
   que parezca que el coche avanza. */
const VIA_H = 104;                 /* línea del suelo del viaje */

function ciclo(i, paso, total, margen) {
  return ((i * paso - margen) % total + total) % total - 44;
}
function cerro(cx, base, w, h, c, nieve) {
  for (let i = 0; i <= h; i++) {
    const half = Math.round(w / 2 * i / h);
    R(cx - half, base - h + i, half * 2 + 1, 1, (nieve && i < h * 0.28) ? nieve : c);
  }
}
function pista(cols, marca, s) {
  vgrad(0, VIA_H, 160, 144 - VIA_H, cols);
  R(0, VIA_H, 160, 1, 'rgba(255,255,255,.20)');
  for (let i = 0; i < 9; i++) {
    const x = (((i * 30 - (s * 2.6 | 0)) % 270) + 270) % 270 - 44;
    R(x, 134, 17, 3, marca);
  }
  for (let i = 0; i < 11; i++) {
    const x = (((i * 21 - (s * 1.7 | 0)) % 231) + 231) % 231 - 44;
    R(x, 124, 9, 1, 'rgba(255,255,255,.16)');
  }
}
function rotulo(txt) {
  const w = textW(txt) + 9;
  R(5, 7, w, 13, 'rgba(18,10,30,.70)');
  R(5, 7, w, 1, 'rgba(255,255,255,.28)');
  R(5, 19, w, 1, 'rgba(0,0,0,.45)');
  drawText(9, 10, txt, '#ffe9a8');
}

/* Cabeza chiquita para asomarse por la ventanilla */
function cabecita(quien, x, y) {
  const c = PERSONAJES[quien].color;
  R(x, y + 2, 10, 8, c.s);
  R(x, y + 7, 10, 3, c.S);

  R(x, y + 1, 2, 5, c['1']); R(x + 8, y + 1, 2, 5, c['1']);

  if (quien === 'roberto') R(x + 2, y + 8, 6, 2, c.b);
  R(x + 4, y + 8, 3, 1, c.m);
}

/* El coche de perfil, con Santi manejando */
function coche(cx, cy, t, parado, vacio) {
  const bob = parado ? 0 : ((t / 5 | 0) % 2);
  const y = cy + bob;
  elipse(cx + 27, cy + 27, 27, 3, 'rgba(20,10,30,.28)');
  /* ruedas */
  for (let w = 0; w < 2; w++) {
    const wx = cx + 12 + w * 30;
    disco(wx, y + 21, 6, '#1b1226');
    disco(wx, y + 21, 3, '#9a90a8');
    const a = parado ? 0.7 : t * 0.45;
    P(Math.round(wx + Math.cos(a) * 4), Math.round(y + 21 + Math.sin(a) * 4), '#e8e0f0');
    P(Math.round(wx - Math.cos(a) * 4), Math.round(y + 21 - Math.sin(a) * 4), '#e8e0f0');
  }
  /* carrocería */
  R(cx + 1, y + 12, 53, 9, '#d94f6a');
  R(cx + 1, y + 12, 53, 1, '#ff8fa3');
  R(cx + 1, y + 19, 53, 2, '#a83350');
  R(cx + 12, y, 30, 13, '#d94f6a');
  R(cx + 12, y, 30, 1, '#ff8fa3');
  /* ventanilla */
  R(cx + 14, y + 2, 26, 11, '#2a3a54');
  R(cx + 14, y + 2, 26, 1, '#6a86a8');
  if (!vacio) cabecita('santiago', cx + 25, y + 3);
  R(cx + 27, y + 2, 1, 11, 'rgba(255,255,255,.18)');
  /* faros, defensa y detalles */
  R(cx + 52, y + 14, 3, 3, '#ffe08a');
  R(cx - 1, y + 15, 3, 3, '#e8b0c0');
  R(cx + 6, y + 18, 43, 1, 'rgba(0,0,0,.22)');
  R(cx + 44, y + 6, 8, 2, '#a83350');
}

  R(0, 0, 160, 144, '#f6e6c0');

  for (let i = 0; i < 40; i++) P((i * 53) % 160, (i * 37) % 144, 'rgba(255,255,255,.12)');
}

   Todo lo del principio pasa en la pantalla del cel: se oscurece el cuarto
   y encima se dibuja el teléfono. La "foto" de cada perfil es el mismo
   sprite del personaje pintado a doble tamaño.

function velo(a) { R(0, 0, 160, 144, 'rgba(10,6,24,' + (a === undefined ? .5 : a) + ')'); }
function centrarEn(x, w, y, s, c, som) { drawTextS(x + Math.round((w - textW(s)) / 2), y, s, c, som); }

function cortar(str, n) {
  const words = (str || '').toUpperCase().split(/\s+/);
  const ls = []; let cur = '';
  for (const w of words) {
    if (!cur.length) cur = w;
    else if (cur.length + 1 + w.length <= n) cur += ' ' + w;
    else { ls.push(cur); cur = w; }
  }
  if (cur) ls.push(cur);
  return ls;
}

  R(x, y, 1, h, '#4c4366'); R(x + w - 1, y, 1, h, '#14101e');
  R(x + (w >> 1) - 8, y + 2, 16, 2, '#14101e');
  R(x + (w >> 1) - 9, y + h - 4, 18, 2, '#635980');
  const sx = x + 4, sy = y + 7, sw = w - 8, sh = h - 14;

  dentro(sx, sy, sw, sh, t);

function appMatch(sx, sy, sw, sh, perfil, desliz, sello, t) {

  const cw = sw - 8, chh = 66, cx = sx + 4 + desliz, cy = sy + 12;
  R(cx + 1, cy + 2, cw, chh, 'rgba(120,40,70,.18)');
  R(cx, cy, cw, chh, '#ffffff');
  R(cx + 1, cy + 1, cw - 2, 30, perfil.fondo);
  drawSpriteEsc(perfil.busto, cx + (cw >> 1) - 16, cy + 1, false, perfil.color, 2);
  R(cx, cy, cw, 1, '#e8355c'); R(cx, cy + chh - 1, cw, 1, '#e4d2da');
  drawText(cx + 3, cy + 33, perfil.nombre, '#3a2a48');

              (i || perfil.bio.length === 1) ? '#5a4a6c' : '#a08eb0');

  if (sello) {
    const bueno = sello > 0;
    const bx = bueno ? cx + 3 : cx + cw - 30;
    R(bx, cy + 3, 27, 11, 'rgba(255,255,255,.88)');
    R(bx, cy + 3, 27, 1, bueno ? '#3ad48a' : '#e8355c');
    drawText(bx + 3, cy + 5, bueno ? 'LIKE' : 'NOPE', bueno ? '#1f9c62' : '#e8355c');
  }

  /* Los botones van encima de la foto, así la ficha cabe completa */
  const by = cy + 22;
  disco(cx + 13, by, 7, 'rgba(30,10,30,.35)'); disco(cx + 13, by, 6, '#ffffff');
  drawText(cx + 11, by - 3, 'X', '#e8355c');

}

function burbuja(sx, y, sw, m, pal, t) {
  if (m.foto) { burbujaFoto(sx, y, sw, m.mio); return; }
  const ls = cortar(m.t, Math.floor((sw - 16) / 6));
  let w = 0; for (const l of ls) w = Math.max(w, textW(l));
  const bw = w + 7, bh = ls.length * 9 + 5;
  const bx = m.mio ? sx + sw - bw - 4 : sx + 4;
  R(bx + 1, y + 1, bw, bh, 'rgba(60,40,90,.20)');
  R(bx, y, bw, bh, m.mio ? pal.mio : pal.otro);
  R(bx, y, bw, 1, m.mio ? pal.mioL : pal.otroL);
  for (let i = 0; i < ls.length; i++)
    drawText(bx + 4, y + 3 + i * 9, ls[i], m.mio ? pal.tMio : pal.tOtro);
  if (m.chispas) {
    const px = [-4, bw + 2, -3, bw + 1, 3, bw - 5, bw >> 1];
    const py = [-3, -2, bh, bh - 2, -4, bh + 2, -4];
    for (let i = 0; i < 7; i++) {
      if (((t / 5 | 0) + i * 3) % 12 > 6) continue;
      destello(bx + px[i], y + py[i], i % 2 ? '#ffe06b' : '#ffffff');
    }
  }
}
/* Se apilan desde abajo: si no caben, los viejos simplemente no se pintan */
function pilaChat(sx, sy, sw, sh, msgs, n, pal, topY, t) {
  let y0 = sy + sh - 4;
  const vis = [];
  for (let i = Math.min(n, msgs.length) - 1; i >= 0; i--) {
    const h = altoBurbuja(sw, msgs[i]);
    if (y0 - h < sy + topY) break;
    y0 -= h + 3;
    vis.unshift({ m: msgs[i], y: y0 });
  }
  for (const v of vis) burbuja(sx, v.y, sw, v.m, pal, t);
}

/* ---------- Caja de diálogo ---------- */
const BOX_Y = 96, BOX_H = 46, MAXCH = 23;

function wrap(str) {
  const words = str.toUpperCase().split(/\s+/);
  const lines = []; let cur = '';
  for (const w of words) {
    if (!cur.length) cur = w;
    else if (cur.length + 1 + w.length <= MAXCH) cur += ' ' + w;
    else { lines.push(cur); cur = w; }
  }
  if (cur) lines.push(cur);
  const pages = [];
  for (let i = 0; i < lines.length; i += 3) pages.push(lines.slice(i, i + 3));
  return pages;
}

/* Marco con relieve: borde oscuro, luz arriba, sombra abajo. */
function drawBox(pages, page, revealed, blink, quien) {
  const p = PERSONAJES[quien];
  R(5, BOX_Y + 2, 152, BOX_H, 'rgba(12,6,28,.40)');           // sombra proyectada
  R(4, BOX_Y, 152, BOX_H, '#f6efdc');                          // papel
  R(4, BOX_Y, 152, 10, p ? p.color.c : '#5f34a0');             // barra del nombre
  R(4, BOX_Y, 152, 1, 'rgba(255,255,255,.55)');
  R(4, BOX_Y + 9, 152, 1, 'rgba(0,0,0,.35)');
  R(4, BOX_Y, 152, 1, '#241a3c'); R(4, BOX_Y + BOX_H - 1, 152, 1, '#241a3c');
  R(4, BOX_Y, 1, BOX_H, '#241a3c'); R(155, BOX_Y, 1, BOX_H, '#241a3c');
  R(5, BOX_Y + 10, 150, 1, 'rgba(255,255,255,.85)');
  R(5, BOX_Y + BOX_H - 2, 150, 1, '#cbbfa4');
  R(154, BOX_Y + 10, 1, BOX_H - 12, '#cbbfa4');
  if (p) {
    const claro = (p.tinta === '#2a2438');
    drawTextS(10, BOX_Y + 2, p.nombre, p.tinta || '#f4eeff',
                             claro ? 'rgba(255,255,255,.45)' : 'rgba(0,0,0,.45)');
    corazon(146, BOX_Y + 2, blink);
  }

  const lines = pages[page] || [];
  let count = 0;
  for (let i = 0; i < lines.length; i++) {
    let ln = lines[i];
    if (count + ln.length > revealed) ln = ln.slice(0, Math.max(0, revealed - count));
    count += (pages[page][i] || '').length;
    drawTextS(10, BOX_Y + 13 + i * 11, ln, '#2a2035', 'rgba(190,176,148,.75)');
  }
  const total = lines.join('').length;
  if (revealed >= total && blink) {
    for (let i = 0; i < 4; i++) R(145 + i, BOX_Y + BOX_H - 8 + i, 7 - i * 2, 1, '#a8407a');
  }
}

/* ---------- Audio (chiptune con onda cuadrada) ---------- */
let AC = null, musicOn = false, musicStep = 0, musicTimer = null;
const N = {C4:261.63,D4:293.66,E4:329.63,F4:349.23,G4:392,A4:440,B4:493.88,
           C5:523.25,D5:587.33,E5:659.25,F5:698.46,G5:783.99,A5:880,B5:987.77,C6:1046.5};
const LEAD = ['E5','G5','A5','B5','A5','G5','E5',null,'D5','E5','G5','A5','G5','E5','D5',null,
              'C5','E5','G5','C6','B5','G5','E5',null,'D5','F5','A5','G5','E5','D5','C5',null];
const BASS = ['C4',null,null,null,'G4',null,null,null,'A4',null,null,null,'F4',null,null,null,
              'C4',null,null,null,'E4',null,null,null,'F4',null,null,null,'G4',null,null,null];

function tone(freq, dur, vol, type) {
  if (!AC || !freq) return;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'square'; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + dur);
  o.connect(g); g.connect(AC.destination);
  o.start(); o.stop(AC.currentTime + dur);
}
function tick() {
  if (!musicOn) return;
  tone(N[LEAD[musicStep % 32]], 0.16, 0.05, 'square');
  tone(N[BASS[musicStep % 32]], 0.30, 0.04, 'triangle');
  musicStep++;
  musicTimer = setTimeout(tick, 185);
}
function blip() { if (musicOn) tone(880, 0.03, 0.03, 'square'); }
function chime() { if (!musicOn) return; tone(N.G5, .09, .06); setTimeout(() => tone(N.C6, .16, .06), 95); }

const muteBtn = document.getElementById('mute');

/* iOS solo deja abrir el audio dentro de un toque real, y hay que
   "despertarlo" con un buffer mudo la primera vez. */
let audioListo = false;
function ensureAudio() {
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    if (!audioListo) {
      const src = AC.createBufferSource();
      src.buffer = AC.createBuffer(1, 1, 22050);
      src.connect(AC.destination); src.start(0);
      audioListo = true;
    }
  } catch (e) {}
}

document.getElementById('reset').onclick = () => { ensureAudio(); reiniciar(); };
document.getElementById('escenas').onclick = () => {

  if (estado === 'saltos') estado = saltoVuelve; else abrirSaltos();
};

muteBtn.onclick = () => {
  ensureAudio();
  musicOn = !musicOn;
  muteBtn.textContent = 'SONIDO: ' + (musicOn ? 'ON' : 'OFF');
  clearTimeout(musicTimer);
  if (musicOn) tick();
};


/* ---------- Controles ---------- */
const keys = {};
const pressed = {};
function setKey(k, v) {
  if (v && !keys[k]) pressed[k] = true;
  keys[k] = v;
}
document.querySelectorAll('[data-k]').forEach(b => {
  const k = b.dataset.k;
  const on = e => { e.preventDefault(); ensureAudio(); setKey(k, true); };
  const off = e => { e.preventDefault(); setKey(k, false); };
  b.addEventListener('touchstart', on, {passive:false});
  b.addEventListener('touchend', off, {passive:false});
  b.addEventListener('touchcancel', off, {passive:false});
  b.addEventListener('mousedown', on);
  b.addEventListener('mouseup', off);
  b.addEventListener('mouseleave', off);
});
const KMAP = {ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',
              z:'a',Z:'a',x:'b',X:'b',Enter:'start',' ':'a',Shift:'select'};
addEventListener('keydown', e => { if (KMAP[e.key]) { e.preventDefault(); ensureAudio(); setKey(KMAP[e.key], true); } });
addEventListener('keyup',   e => { if (KMAP[e.key]) { e.preventDefault(); setKey(KMAP[e.key], false); } });

/* Una "charla" es una lista de {q:quién, t:qué dice}. Así una misma escena
   puede tener ida y vuelta entre los dos y no solo una frase suelta. */
function cargarLinea() {
  const l = charla[charlaIdx];
  pages = wrap(l.t); page = 0; revealed = 0; textTimer = 0; hablante = l.q;
  chime();
}
function abrirCharla(lineas, tipo, volver) {
  charla = lineas; charlaIdx = 0;
  volverA = volver || 'juego';
  cargarLinea();
  estado = tipo || 'dialogo';
}
function charlaDeMes(m) {
  const d = HISTORIA.meses[m];
  return d.charla ? d.charla : [{ q: HISTORIA.jugador, t: d.texto }];
}
/* Va destapando letra por letra */
function correrTexto() {
  const total = (pages[page] || []).join('').length;
  if (revealed < total) {
    textTimer++;
    if (textTimer % 2 === 0) { revealed++; if (revealed % 3 === 0) blip(); }
  }
}
/* Un toque de A: primero completa la línea, luego pasa de página, luego de
   frase. Devuelve true solo cuando ya no queda nada que decir. */
function avanzarTexto() {
  const total = (pages[page] || []).join('').length;
  if (revealed < total) { revealed = total; return false; }
  if (page < pages.length - 1) { page++; revealed = 0; return false; }
  if (charlaIdx < charla.length - 1) { charlaIdx++; cargarLinea(); return false; }
  return true;
}

/* Si ya hay un barrido corriendo se ignora: si no, la condición de salida
   se cumple en cada cuadro y reinicia el fade en 0 para siempre. */
function transicionar(fn) {
  if (fadeDir !== 0) return;
  fadeDir = 1; fade = 0; pendiente = fn;
}

/* Barrido de transición. Tiene que correr en TODAS las pantallas
   (título y créditos también salen por su propio return). */
function pasoFade() {
  if (fadeDir === 0) return;
  fade += fadeDir * 5;
  if (fadeDir === 1 && fade >= 160) {
    fade = 160; fadeDir = -1;
    if (pendiente) { pendiente(); pendiente = null; }
  } else if (fadeDir === -1 && fade <= 0) {
    fade = 0; fadeDir = 0; return;
  }
  const x = (fadeDir === 1) ? 0 : 160 - fade;
  R(x, 0, fade, 144, '#120b24');
  R(fadeDir === 1 ? fade - 2 : x, 0, 2, 144, '#5f34a0');
}

  if (pianoT > 14) {

  if (pianoT === 37) golpePiano();

const SALTOS_VIS = 11;

function abrirSaltos() {
  if (estado === 'saltos') return;
  saltoVuelve = estado;
  fade = 0; fadeDir = 0; pendiente = null;
  estado = 'saltos';
}
function saltarA(i) {
  fade = 0; fadeDir = 0; pendiente = null;
  charla = []; charlaIdx = 0; pages = []; page = 0; revealed = 0; textTimer = 0;
  for (const k in keys) keys[k] = false;
  for (const k in pressed) pressed[k] = false;
  SALTOS[i].f();
}
function pantallaSaltos(t) {
  vgrad(0, 0, 160, 144, ['#1a0f2e','#22143c','#2a1848','#331d54']);
  R(0, 0, 160, 13, '#5f34a0'); R(0, 0, 160, 1, '#8f63d6'); R(0, 12, 160, 1, '#2a1550');
  drawText(4, 3, 'IR A...', '#ffffff');
  drawText(110, 3, (saltoSel + 1) + '/' + SALTOS.length, '#d9c2ff');
  for (let i = 0; i < SALTOS_VIS; i++) {
    const idx = saltoTop + i;
    if (idx >= SALTOS.length) break;
    const y = 17 + i * 10;
    if (idx === saltoSel) {
      R(2, y - 2, 156, 10, '#f6efdc');
      corazon(4, y - 1, (t / 12 | 0) % 2);
    }
    drawText(15, y, SALTOS[idx].n, idx === saltoSel ? '#5f34a0' : '#bda6e4');
  }
  /* barra de desplazamiento */
  if (SALTOS.length > SALTOS_VIS) {
    const alto = Math.max(8, Math.round(114 * SALTOS_VIS / SALTOS.length));
    const arr = Math.round(114 * saltoTop / SALTOS.length);
    R(157, 15, 2, 114, '#3a2560');
    R(157, 15 + arr, 2, alto, '#a882e8');
  }
  R(0, 131, 160, 13, '#2a1550'); R(0, 131, 160, 1, '#5f34a0');
  drawText(4, 134, 'A = IR    B = SALIR', '#bda6e4');
}


/* ---------- Bucle principal ---------- */
/* sinFade sirve cuando la escena que sigue usa el mismo fondo:
   el barrido ahí sólo estorba. */
function correrGuion(lista, alTerminar, sinFade) {
  guion = lista; gPaso = 0; gT = 0; gFin = alTerminar; gSinFade = !!sinFade;
  estado = 'guion';
}
function pasoGuion() {
  if (gPaso >= guion.length - 1) {
    const f = gFin;
    if (gSinFade) { gSinFade = false; if (f) f(); }
    else transicionar(() => { if (f) f(); });
  } else { gPaso++; gT = 0; }
}
function abrirMenu(pregunta, ops, quien, fondo, fn) {
  menu = { pregunta: pregunta, ops: ops, quien: quien, fondo: fondo, fn: fn, sel: 0 };
  estado = 'menu';
}
function menuEspera() {
  abrirMenu('¿LO ESPERAS?', ['ME ESPERO', 'ME VOY'], 'roberto', fondoEspera, i => {
    if (i === 1) { pianoT = 0; estado = 'piano'; }
    else { estado = 'juego'; mes = 0; jug.x = 6; jug.mirando = 1; corazonTomado = false; }
  });
}
function fondoAmigo(t) { bgAmigo(t); sentadosAmigo(t, true); frAmigo(t); }
function menuPuerto() {
  abrirMenu('PUERTO ESCONDIDO', ['INVITARLO', 'NO INVITARLO'], 'roberto', fondoAmigo, i => {
    if (i === 1) transicionar(() => correrGuion(AVION_MALO, () => { estado = 'explotado'; }));
    else correrGuion(PUERTO, empezarMaleta);
  });
}
function menuBaile() {
  abrirMenu('¿CÓMO BAILAS?', ['LA MACARENA', 'PAYASO DE RODEO', 'SALSA'], 'santiago', fondoAntro, i => {

    baileT = 0;
    estado = 'baile';

function finIntro() { estado = 'cuarto'; jug.x = 46; jug.mirando = -1; }
/* Toda la noche: escoger mesa -> la mesera -> se hace tarde -> el antro */

  estado = 'sentarse'; jug.x = 6; jug.mirando = 1;

  mes = 1; estado = 'juego'; jug.x = 8; jug.mirando = 1;

/* Una semana después: se despierta y no sale del cuarto sin la maleta */

  cuartoNoche = false; maleta = false; cangurera = false;

}
/* Dibuja la caja y devuelve true si el jugador acaba de cerrar la charla */
function charlaEnPantalla() {
  correrTexto();
  drawBox(pages, page, revealed, (t / 22 | 0) % 2, hablante);
  return (consumed('a') || consumed('b')) && avanzarTexto();
}

function loop() {
  t++;
  ctx.clearRect(0, 0, 160, 144);
  const hablando = (estado === 'dialogo' || estado === 'dialogoFinal');

  /* SELECT abre y cierra el selector de escenas desde donde sea */
  if (consumed('select')) { if (estado === 'saltos') estado = saltoVuelve; else abrirSaltos(); }

  if (estado === 'saltos') {
    pantallaSaltos(t);
    if (keys.up || keys.down) repite++; else repite = 0;
    const rep = repite > 16 && repite % 4 === 0;
    let d = 0;
    if (consumed('up')   || (keys.up   && rep)) d = -1;
    if (consumed('down') || (keys.down && rep)) d = 1;
    if (consumed('left'))  d = -SALTOS_VIS;
    if (consumed('right')) d = SALTOS_VIS;
    if (d) {
      saltoSel = Math.max(0, Math.min(SALTOS.length - 1, saltoSel + d));
      saltoTop = Math.max(saltoSel - SALTOS_VIS + 1, Math.min(saltoTop, saltoSel));
      saltoTop = Math.max(0, Math.min(SALTOS.length - SALTOS_VIS, saltoTop));
    }
    if (consumed('a') || consumed('start')) { ensureAudio(); saltarA(saltoSel); }
    else if (consumed('b')) estado = saltoVuelve;
    requestAnimationFrame(loop); return;
  }

  if (estado === 'boot') {
    bootT++;
    pantallaBoot();
    const salta = consumed('a') || consumed('start');
    if (salta) ensureAudio();
    if (bootT >= 130 || (salta && bootT > 6)) transicionar(() => { estado = 'titulo'; });
    pasoFade();
    requestAnimationFrame(loop); return;
  }

  if (estado === 'titulo') {
    pantallaTitulo(t);
    if (consumed('a') || consumed('start')) {
      ensureAudio();
      if (!musicOn) muteBtn.click();
      transicionar(() => {
        mes = 0; corazonTomado = false; cangurera = false;
        correrGuion(INTRO, finIntro);
      });
    }
    pasoFade();
    requestAnimationFrame(loop); return;
  }

  /* --- Guiones (la intro y la espera de Roberto) --- */
  if (estado === 'guion') {
    const p = guion[gPaso];
    gT++;
    if (gT === 1) {
      if (p.hacer) p.hacer();
      if (p.t) { charla = [{ q: p.q, t: p.t }]; charlaIdx = 0; cargarLinea(); }
    }
    (CUADROS[p.e] || bgCuarto)(gT, p.a || {});
    if (p.dur) { if (gT >= p.dur) pasoGuion(); }
    else if (p.espera) { if (consumed('a') || consumed('start')) pasoGuion(); }
    else if (charlaEnPantalla()) pasoGuion();
    pasoFade();
    requestAnimationFrame(loop); return;
  }

  /* --- El cuarto, ya jugable: sin cangurera no hay salida --- */
  if (estado === 'cuarto' || (hablando && volverA === 'cuarto')) {
    bgCuarto(t);
    if (!cangurera) cangureraSuelo(CANG_X, CANG_Y, t);
    const anda = (estado === 'cuarto') && (keys.left || keys.right);
    persona('santiago', jug.x, GROUND - 30, jug.mirando < 0, anda, t);
    frCuarto(t);
    if (cangurera && (t / 20 | 0) % 2) flechaSalida(112, GROUND - 44);

    if (estado === 'cuarto') {
      if (keys.left)  { jug.x -= 0.9; jug.mirando = -1; }
      if (keys.right) { jug.x += 0.9; jug.mirando = 1; }
      jug.x = Math.max(2, Math.min(106, jug.x));

      if (!cangurera && Math.abs(jug.x - CANG_X) < 13) {
        cangurera = true;
        abrirCharla([{ q:'santiago', t:'LA CANGURERA VERDE. AHORA SÍ.' }], 'dialogo', 'cuarto');
      } else if (jug.x >= 105) {
        if (cangurera) transicionar(empezarEspera);
        else {
          jug.x = 96;
          abrirCharla([{ q:'santiago', t:'ESPERA. NO ME VOY SIN LA CANGURERA.' }], 'dialogo', 'cuarto');
        }
      }
    }
    if (hablando && charlaEnPantalla()) estado = volverA;
    pasoFade();
    requestAnimationFrame(loop); return;
  }

  /* --- El cuarto una semana después: sin maleta no hay viaje --- */
  if (estado === 'maleta' || (hablando && volverA === 'maleta')) {
    bgCuarto(t);
    if (!maleta) maletaSuelo(MAL_X, MAL_Y, t);
    const anda = (estado === 'maleta') && (keys.left || keys.right);
    persona('santiago', jug.x, GROUND - 30, jug.mirando < 0, anda, t);
    frCuarto(t);
    if (maleta && (t / 20 | 0) % 2) flechaSalida(112, GROUND - 44);

    if (estado === 'maleta') {
      if (keys.left)  { jug.x -= 0.9; jug.mirando = -1; }
      if (keys.right) { jug.x += 0.9; jug.mirando = 1; }
      jug.x = Math.max(2, Math.min(106, jug.x));

      if (!maleta && Math.abs(jug.x - MAL_X) < 14) {
        maleta = true;
        abrirCharla([{ q:'santiago', t:'A VER CUÁNTO TIEMPO HARÉ. NUNCA HE IDO A ZONA ESMERALDA.' }],
                    'dialogo', 'maleta');
      } else if (jug.x >= 105) {
        if (maleta) transicionar(() => correrGuion(VIAJE, finViaje, true));
        else {
          jug.x = 96;
          abrirCharla([{ q:'santiago', t:'SIN MALETA NO ME VOY A NINGÚN LADO.' }], 'dialogo', 'maleta');
        }
      }
    }
    if (hablando && charlaEnPantalla()) estado = volverA;
    pasoFade();
    requestAnimationFrame(loop); return;
  }

  /* --- Roberto llega a la casa y hay que llevarlo a la cocina --- */
  if (estado === 'aCocina') {
    bgCuarto(t);
    const anda = keys.left || keys.right;
    persona('santiago', jug.x - 24, GROUND - 30, jug.mirando < 0, anda, t + 9);
    persona('roberto', jug.x, GROUND - 30, jug.mirando < 0, anda, t);
    frCuarto(t);
    if ((t / 20 | 0) % 2) flechaEntrada(8, GROUND - 44);
    avisoArriba('LA COCINA ESTÁ ALLÁ', 102);
    if (keys.left)  { jug.x -= 0.9; jug.mirando = -1; }
    if (keys.right) { jug.x += 0.9; jug.mirando = 1; }
    jug.x = Math.max(26, Math.min(140, jug.x));
    if (jug.x <= 27) transicionar(empezarCocinar);
    pasoFade();
    requestAnimationFrame(loop); return;
  }

  /* --- La cocina: Roberto le pasa los ingredientes del refri --- */
  if (estado === 'cocinar') {
    bgCocina(t, true);
    persona('santiago', 126, GROUND - 30, true, false, t);
    persona('roberto', jug.x, GROUND - 30, jug.mirando < 0, keys.left || keys.right, t);
    if (llevando) ingrediente(ingr, Math.round(jug.x) + 3, GROUND - 44);
    frCocina(t);

    const enRefri  = jug.x < 34;
    const enEstufa = jug.x > 96;
    if (ingr < INGREDIENTES.length)
      avisoArriba(llevando ? 'LLÉVASELO' : 'PÁSAME ' + INGREDIENTES[ingr], 102);
    if ((t / 18 | 0) % 2) {
      if (!llevando && enRefri)  avisoArriba('A = ABRIR EL REFRI', 118);
      if (llevando && enEstufa)  avisoArriba('A = DÁRSELO', 118);
    }

    if (keys.left)  { jug.x -= 0.9; jug.mirando = -1; }
    if (keys.right) { jug.x += 0.9; jug.mirando = 1; }
    jug.x = Math.max(4, Math.min(118, jug.x));
    if (consumed('a') || consumed('start')) {
      if (!llevando && enRefri) llevando = true;
      else if (llevando && enEstufa) {
        llevando = false; ingr++;
        if (ingr >= INGREDIENTES.length) correrGuion(PASTA, finActo);
      }
    }
    pasoFade();
    requestAnimationFrame(loop); return;
  }

  /* --- El medidor: la respuesta sólo vale fuera de la barra --- */
  if (estado === 'medidor') {
    pantallaMedidor(t);
    if (medMsg > 0) { medMsg--; if (medMsg === 0) medX = MED_MIN; }
    else {
      if (keys.left)  medX -= 1.1;
      if (keys.right) medX += 1.1;
      medX = Math.max(MED_MIN, Math.min(MED_MAX, medX));
      if (consumed('a') || consumed('start')) {
        if (medX > MED_OK) transicionar(() => correrGuion(CIERRE, empezarCocina));
        else medMsg = 76;
      }

  /* --- Menús: esperar o no, y cómo bailar --- */
  if (estado === 'menu') {

  /* --- Adentro del club: Roberto escoge mesa --- */

      R(ax, 16, aw, 1, 'rgba(255,224,138,.5)'); R(ax, 27, aw, 1, 'rgba(0,0,0,.5)');
      drawText(ax + 4, 18, aviso, cerca >= 0 ? '#ffe08a' : '#f6efdc');
    }
    if (keys.left)  { jug.x -= 0.9; jug.mirando = -1; }
    if (keys.right) { jug.x += 0.9; jug.mirando = 1; }
    jug.x = Math.max(2, Math.min(142, jug.x));
    if (cerca >= 0 && (consumed('a') || consumed('start'))) {
      mesaElegida = cerca;
      correrGuion(NOCHE, () => correrGuion(ANTRO, menuBaile, true));

  /* --- El baile --- */
  if (estado === 'baile') {
    baileT++;
    bgDrags(t);
    bailando('santiago', 58, GROUND - 30, t, baileTipo);
    bailando('roberto', 90, GROUND - 30, t + 13, baileTipo);
    frDrags(t);
    if ((t / 26 | 0) % 2) centerText(16, NOMBRE_BAILE[baileTipo], '#ffe08a', 'rgba(20,6,30,.85)');
    if (baileT > 170 || (baileT > 40 && (consumed('a') || consumed('start'))))
      correrGuion(BESO, finBeso);
    pasoFade();
    requestAnimationFrame(loop); return;
  }

  if (estado === 'piano') {
    pianoT++;
    pantallaPiano(t);
    if (pianoT > 88) transicionar(() => { estado = 'gameover'; });
    pasoFade();
    requestAnimationFrame(loop); return;

  if (estado === 'gameover') {
    pantallaGameOver(t);
    if (consumed('a') || consumed('start')) transicionar(menuEspera);

  if (estado === 'explotado') {
    pantallaExplotado(t);

  if (estado === 'creditos') {
    pantallaCreditos(t);
    if (consumed('a') || consumed('start')) transicionar(() => { estado = 'titulo'; });
    pasoFade();
    requestAnimationFrame(loop); return;
  }

  /* --- Escena de juego --- */
  const esFinal = (estado === 'final' || estado === 'dialogoFinal');
  const datosMes = HISTORIA.meses[mes];
  const clave = (esFinal || !datosMes) ? 'ciudad' : datosMes.escena;
  (ESCENAS[clave] || bgParque)(t);

  const yPie = GROUND - 30;
  const conPareja = !esFinal && datosMes && datosMes.pareja != null;
  const objetivo = conPareja ? datosMes.pareja - 16 : 118;
  const caminando = (estado === 'juego' || estado === 'final') && (keys.left || keys.right);

  if (esFinal) {

    if (jug.x >= 88) for (let i = 0; i < 3; i++)
      corazon(94 + i * 9, yPie - 10 - (((t / 3 + i * 9) % 24) | 0), (t / 10 | 0) % 2);
  } else {
    if (conPareja) {

      const px = corazonTomado ? Math.min(jug.x + 19, 150) : datosMes.pareja;

    if (corazonTomado && (t / 20 | 0) % 2) {
      flechaSalida(146, GROUND - 40);
      const et = clave === 'patio' ? 'ENTRAR' : 'SEGUIR';
      const aw = textW(et) + 7;
      R(154 - aw, GROUND - 56, aw, 11, 'rgba(20,10,6,.75)');
      R(154 - aw, GROUND - 56, aw, 1, 'rgba(255,224,138,.5)');
      drawText(157 - aw, GROUND - 54, et, '#ffe08a');
    }
  }

  persona(HISTORIA.jugador, jug.x, yPie, jug.mirando < 0, caminando, t);

  (FRENTES[clave] || frParque)(t);

  if (!esFinal && mes > 0) hud(mes + 1, HISTORIA.meses.length);

  if (estado === 'juego' || estado === 'final') {
    if (keys.left)  { jug.x -= 0.9; jug.mirando = -1; }
    if (keys.right) { jug.x += 0.9; jug.mirando = 1; }
    jug.x = Math.max(4, Math.min(142, jug.x));

    if (estado === 'juego' && !corazonTomado && Math.abs(jug.x - objetivo) < 14) {
      corazonTomado = true;
      abrirCharla(charlaDeMes(mes), 'dialogo');
    }
    if (estado === 'juego' && corazonTomado && jug.x >= 141) {
      if (datosMes && datosMes.acto) transicionar(empezarNoche);
      else transicionar(() => {
        mes++; jug.x = 8; corazonTomado = false; cangurera = false;
        estado = (mes >= HISTORIA.meses.length) ? 'final' : 'juego';
      });
    }
    if (estado === 'final' && jug.x >= 90) {
      abrirCharla([{ q: HISTORIA.jugador, t: HISTORIA.final }], 'dialogoFinal');
    }
  }

  if (hablando && charlaEnPantalla()) {
    if (estado === 'dialogoFinal') transicionar(() => { estado = 'creditos'; });
    else estado = volverA;
  }

  pasoFade();
  requestAnimationFrame(loop);
}
loop();
</script>
